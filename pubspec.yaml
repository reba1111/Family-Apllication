name: couple_app
description: A private & free Couple App built with Flutter + Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # Navigation
  go_router: ^14.2.7

  # State Management
  provider: ^6.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  table_calendar: ^3.1.2

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # AI
  google_generative_ai: ^0.4.6

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  firebase_messaging: ^15.2.10
  googleapis_auth: ^2.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  web:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/service_account.json
